[project]
name = "t1-shipments-core"
version = "0.1.0"
description = "Core SDK para la API de T1Envios — auth, cliente HTTP, modelos base"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "keyring>=25.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = {"src/t1shipments/core" = "t1shipments/core"}

