[project]
name = "t1-shipments-cli"
version = "0.1.0"
description = "CLI para la API de T1Envios"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "t1-shipments-core>=0.1.0",
    "typer>=0.24.2",
    "rich>=15.0.0",
]

[project.scripts]
t1 = "t1shipments.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = {"src/t1shipments/cli" = "t1shipments/cli"}

[tool.uv.sources]
t1-shipments-core = { workspace = true }
