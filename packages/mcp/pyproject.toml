[project]
name = "t1-shipments-mcp"
version = "0.1.0"
description = "MCP server para la API de T1Envios"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "t1-shipments-core>=0.1.0",
    "mcp>=1.27.0",
]

[project.scripts]
t1shipments-mcp = "t1shipments.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = {"src/t1shipments/mcp" = "t1shipments/mcp"}

[tool.uv.sources]
t1-shipments-core = { workspace = true }
