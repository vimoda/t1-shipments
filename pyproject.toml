[tool.uv.workspace]
members = [
    "packages/core",
    "packages/cli",
    "packages/mcp",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/core/src",
    "packages/cli/src",
    "packages/mcp/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=t1shipments --cov-report=term-missing"

[tool.coverage.run]
source_pkgs = ["t1shipments"]
