[project]
name = "t1envios"
version = "0.1.0"
description = "SDK y CLI para la API de T1Envios"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[project.optional-dependencies]
cli = [
    "typer[all]>=0.24.2",
    "rich>=15.0.0",
    "keyring>=25.7.0",
]
mcp = [
    "mcp>=1.27.0",
]
dev = [
    "typer[all]>=0.24.2",
    "rich>=15.0.0",
    "keyring>=25.7.0",
    "mcp>=1.27.0",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
t1 = "t1envios.cli.app:app"
t1-mcp = "t1envios.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t1envios"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=t1envios --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
